<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家電チェッカー</title>
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家電チェッカー">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg: #101418; --panel: #1C232B; --text: #ECEFF3; --sub: #9AA6B2; --accent: #3CC8FF; --ok: #5CE08A; --warn: #FFC24A; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    -webkit-text-size-adjust: 100%; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .top { display: flex; align-items: flex-start; }
  .top > div { flex: 1; }
  h1 { font-size: 24px; margin: 4px 0 2px; }
  .sub { color: var(--sub); font-size: 14px; }
  .label { color: var(--sub); font-size: 14px; margin-top: 18px; }
  .big { font-size: 20px; margin-top: 2px; word-break: break-all; }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row > * { flex: 1; min-width: 0; }
  .btn { display: block; box-sizing: border-box; width: 100%; min-height: 50px; padding: 12px 8px; border: 0; border-radius: 16px;
    background: linear-gradient(135deg, #3A4757, #2C3744); color: #fff; font-size: 17px; font-weight: bold; text-align: center;
    text-decoration: none; -webkit-appearance: none; cursor: pointer; font-family: inherit; }
  .btn:disabled { opacity: 0.5; }
  .btn.cam { min-height: 64px; font-size: 19px; background: linear-gradient(135deg, #FF9A3C, #FF5E62); }
  .btn.pick { min-height: 64px; font-size: 19px; background: linear-gradient(135deg, #3CC8FF, #3A7BD5); }
  .btn.ai { background: linear-gradient(135deg, #B07CFF, #7B5CFF); }
  .btn.manual { min-height: 56px; background: linear-gradient(135deg, #5CE08A, #1FA67A); }
  .btn.small { min-height: 0; padding: 8px 14px; font-size: 14px; border-radius: 12px; width: auto; }
  .btn.doc { text-align: left; padding: 12px 14px; font-weight: normal; margin-top: 8px; }
  input[type=file] { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  input[type=text], input[type=number] { box-sizing: border-box; width: 100%; padding: 10px; font-size: 20px;
    border: 1px solid #3A4552; border-radius: 10px; background: var(--panel); color: var(--text); -webkit-appearance: none; font-family: inherit; }
  #model { font-family: Menlo, Consolas, monospace; text-transform: uppercase; }
  /* 写真: 2 本の指で広げる・動かす・ダブルタップ */
  #view { position: relative; margin-top: 12px; height: 340px; background: var(--panel); border-radius: 12px; overflow: hidden;
    touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  #view.zoomed { touch-action: none; }
  #view .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--sub); }
  #photo { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; -webkit-user-drag: none; pointer-events: none; }
  #tip { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #fff;
    font-size: 12px; padding: 4px 10px; border-radius: 12px; white-space: nowrap; pointer-events: none; }
  #status { margin-top: 8px; min-height: 20px; }
  .result { margin-top: 12px; padding: 12px; background: var(--panel); border-radius: 12px; }
  a { color: var(--accent); }
  .ym { display: flex; align-items: center; margin-top: 6px; font-size: 18px; }
  .ym input { width: 96px; text-align: center; }
  .ym input.m { width: 64px; }
  .ym span { margin: 0 8px; }
  .years { font-size: 24px; font-weight: bold; color: var(--ok); margin-top: 8px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--sub); border-top-color: transparent; border-radius: 50%;
    animation: sp 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .foot { font-size: 12px; color: var(--sub); margin-top: 28px; line-height: 1.6; }
  #offline { font-size: 12px; color: var(--warn); background: #2A2416; border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="offline" class="hidden"></div>
  <div class="top">
    <div>
      <h1>家電チェッカー</h1>
      <div class="sub">品番から、使った年数と取扱説明書を調べます</div>
    </div>
    <button class="btn small" id="setBtn">設定</button>
  </div>

  <div id="setup" class="result hidden">
    <div>はじめに「設定」で、スクリプトの URL と合言葉を入れてください。</div>
    <div class="row"><button class="btn" id="setBtn2">設定する</button></div>
  </div>

  <div class="row">
    <label class="btn cam" for="cam">写真を撮る</label>
    <label class="btn pick" for="pick">写真を選ぶ</label>
  </div>
  <input id="cam" type="file" accept="image/*" capture="environment">
  <input id="pick" type="file" accept="image/*">

  <div id="view"><div class="empty">ここに写真が出ます</div><img id="photo" class="hidden" alt=""><div id="tip" class="hidden"></div></div>
  <div id="rotRow" class="row hidden">
    <button class="btn" id="rotL">↺ 左に回す</button>
    <button class="btn" id="rotR">↻ 右に回す</button>
  </div>
  <div id="status" class="sub"></div>

  <div class="label">品番（分かっていれば入れてください。写真なしでも調べられます）</div>
  <input id="model" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="例 NA-F45B6">
  <div class="row"><button class="btn ai" id="go">AI で調べる（写真と品番から発売日）</button></div>

  <div id="result" class="result hidden"></div>

  <div class="label">取扱説明書（メーカーのサイトから）</div>
  <div class="row"><button class="btn manual" id="manualBtn">取扱説明書を見る</button></div>
  <div id="manual" class="result hidden"></div>

  <div class="label">発売日（自動で入ります。手で入れても計算します）</div>
  <div class="ym">
    <input id="ry" type="number" inputmode="numeric" placeholder="2012"><span>年</span>
    <input id="rm" class="m" type="number" inputmode="numeric" placeholder="12"><span>月 発売</span>
  </div>
  <div id="years" class="years"></div>

  <div class="foot">AI（Google の Gemini）の答えは間違うこともあります。大事なときは価格.com やメーカーのページで確かめてください。<br>
    <span id="ver"></span></div>
</div>
<script src="app.js"></script>
</body>
</html>
